# ConfigMap for Blockchain Microservice

apiVersion: v1
kind: ConfigMap
metadata:
  name: blockchain-service-config
  namespace: blockchain-service
data:
  PORT: "3000"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  SERVICE_NAME: "blockchain-service"
  SERVICE_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.alloy.svc.cluster.local:4317"
  CORS_ALLOWED_ORIGINS: "https://dash.sxdentrypoint.my.id,https://app.sxdentrypoint.my.id"
