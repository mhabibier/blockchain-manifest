apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-node
  namespace: blockchain-network
  labels:
    app.kubernetes.io/name: blockchain-node
    app.kubernetes.io/component: validator # atau bootnode/rpc
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1 # Node blockchain biasanya bersifat stateful (disarankan 1 per deployment atau gunakan StatefulSet)
  selector:
    matchLabels:
      app: blockchain-node
  strategy:
    type: Recreate # Lebih aman untuk blockchain agar tidak ada dua pod mengakses data directory yang sama
  template:
    metadata:
      labels:
        app: blockchain-node
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060" # Port metrik standar Geth/Besu
        prometheus.io/path: "/debug/metrics"
    spec:
      serviceAccountName: blockchain-node-sa
      securityContext:
        fsGroup: 1001 # Penting untuk akses baca/tulis ke volume
      containers:
        - name: blockchain-node
          image: ethereum/client-go:stable # Contoh menggunakan Geth
          imagePullPolicy: Always
          args:
            - "--networkid=12345"
            - "--http"
            - "--http.addr=0.0.0.0"
            - "--http.vhosts=*"
            - "--http.api=eth,net,web3"
            - "--datadir=/data"
            - "--port=30303" # P2P Port
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
            - name: p2p
              containerPort: 30303
              protocol: TCP
            - name: metrics
              containerPort: 6060
              protocol: TCP
          envFrom:
            - configMapRef:
                name: blockchain-node-config
          volumeMounts:
            - name: blockchain-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: blockchain-data
          # Untuk blockchain asli, gunakan PersistentVolumeClaim (PVC)
          emptyDir: {}
        - name: tmp
          emptyDir: {}
