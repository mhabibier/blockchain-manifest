# Service for Blockchain Microservice

apiVersion: v1
kind: Service
metadata:
  name: blockchain-service
  namespace: blockchain-service
  labels:
    app.kubernetes.io/name: blockchain-service
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app: blockchain-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP

